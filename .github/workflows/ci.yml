name: Client checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.8.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm pack --pack-destination artifacts
      - name: Test the packed package in an independent consumer
        working-directory: examples/consumer
        run: |
          npm install --ignore-scripts --no-package-lock ../../artifacts/loftet-atproto-client-0.1.0.tgz
          npm start
